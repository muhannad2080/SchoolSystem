name: SchoolSystem Build

on:
  push:
    branches:
      - feature/new-development
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore SchoolSystem.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Rebuild Release
        run: msbuild SchoolSystem.sln /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /m
