name: Build SchoolSystem

on:
  push:
    branches:
      - feature/new-development
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore .\SchoolSystem.sln

      - name: Build Release
        run: msbuild .\SchoolSystem.sln /m /p:Configuration=Release /p:Platform="Any CPU"

      - name: Build UI smoke tests
        run: msbuild .\Tests\UiSmokeTests\SchoolSystem.UiSmokeTests.csproj /m /p:Configuration=Release /p:Platform="Any CPU"

      - name: Run UI smoke tests
        run: .\Tests\UiSmokeTests\bin\Release\SchoolSystem.UiSmokeTests.exe
